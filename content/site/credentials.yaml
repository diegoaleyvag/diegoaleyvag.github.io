# Structured credential records for the education/credentials section.
#
# `verified` entries are Credly badges the owner confirmed live in this
# session (issuer, level, issue/expiry dates, and the Credly badge URL are
# all owner-provided facts, not inferred) — never a score, per
# `.cursor/rules/content.mdc`.
#
# `terse` entries carry content/source/cv.yaml's three existing
# certification strings through unchanged; that file is read-only and stays
# the sole authority for them. They are kept in their original terse-string
# shape on purpose — never decomposed into issuer/level/date fields nobody
# provided — and `sourcePath` cites the exact cv.yaml array index they trace
# to, using the same `CvSourcePath` shape `@portfolio/resume` uses.
#
# Not translated: certification names are proper nouns / official credential
# titles, not narrative prose, so there is no `en`/`es` split here.
schemaVersion: "1.0.0"
