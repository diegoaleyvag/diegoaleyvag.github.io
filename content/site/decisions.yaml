# Bilingual narrative wrapper for validated Five Decisions manifests.
# English mirrors the canonical manifest; Spanish is a faithful translation.

prism:
  en:
    decision: When is a model good enough?
    summary: A deterministic, simulated workbench for evaluating task-specific
      tradeoffs with inspectable metrics and a static evidence explorer.
  es:
    decision: ¿Cuándo es un modelo suficientemente bueno?
    summary:
      Un banco de trabajo determinista y simulado para evaluar compensaciones
      específicas de cada tarea con métricas inspectables y un explorador
      estático de evidencia.
axiom:
  en:
    decision: Can an AI output keep its contract?
    summary: A CI-ready contract checker for structured AI outputs, with offline
      evaluation and value-free reports.
  es:
    decision: ¿Puede una salida de IA mantener su contrato?
    summary: Un comprobador de contratos preparado para CI para salidas de IA
      estructuradas, con evaluación sin conexión e informes sin valores.
relay:
  en:
    decision: What should survive a failure?
    summary: A reliability lab for checkpointed, observable agent workflows.
  es:
    decision: ¿Qué debería sobrevivir a un fallo?
    summary: Un laboratorio de fiabilidad para flujos de trabajo de agentes
      observables y con puntos de control.
limen:
  en:
    decision: What belongs in context?
    summary:
      A deterministic lab for comparing context-selection strategies under
      fixed budgets.
  es:
    decision: ¿Qué pertenece al contexto?
    summary:
      Un laboratorio determinista para comparar estrategias de selección de
      contexto con presupuestos fijos.
vector:
  en:
    decision: Which architecture fits the constraints?
    summary: A transparent studio for comparing AI architecture patterns under
      explicit constraints.
  es:
    decision: ¿Qué arquitectura se ajusta a las restricciones?
    summary:
      Un estudio transparente para comparar patrones de arquitectura de IA
      bajo restricciones explícitas.
